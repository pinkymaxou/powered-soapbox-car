name: Build firmware

on:
  push:
    branches: [ main, master ]
    paths: [ "firmware/**", ".github/workflows/firmware.yml" ]
  pull_request:
    paths: [ "firmware/**", ".github/workflows/firmware.yml" ]
  workflow_dispatch:

jobs:
  # Tests de la logique pure (PID, math de contrôle, buffer circulaire) — rapides, sans IDF.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests hôte (g++)
        run: firmware/test_host/run_tests.sh

  # Simulation physique : les SCÉNARIOS (anti-renversement, pannes, pentes, chargements
  # asymétriques…) doivent tous passer — c'est le banc d'essai virtuel du kart.
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scénarios physiques (contrôleur réel + modèle du véhicule)
        run: firmware/test_host/run_sim.sh

  build:
    runs-on: ubuntu-latest
    # Image Docker officielle ESP-IDF 6.1 (branche release/v6.1, comme en local).
    container:
      image: espressif/idf:release-v6.1
    steps:
      - uses: actions/checkout@v4

      - name: Build (ESP-IDF 6.1, cible esp32)
        shell: bash
        working-directory: firmware
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build

      - name: Archiver le binaire
        uses: actions/upload-artifact@v4
        with:
          name: kart_firmware
          path: |
            firmware/build/kart_firmware.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          if-no-files-found: warn
