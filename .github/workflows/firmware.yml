name: Build firmware

on:
  push:
    branches: [ main, master ]
    paths: [ "firmware/**", ".github/workflows/firmware.yml" ]
  pull_request:
    paths: [ "firmware/**", ".github/workflows/firmware.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (ESP-IDF 6.1, cible esp32)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release/v6.1
          target: esp32
          path: firmware

      - name: Archiver le binaire
        uses: actions/upload-artifact@v4
        with:
          name: kart_firmware
          path: |
            firmware/build/kart_firmware.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
          if-no-files-found: warn
