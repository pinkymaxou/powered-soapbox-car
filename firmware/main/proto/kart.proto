// kart.proto — Binary WebSocket protocol of the kart (Protocol Buffers).
// Server: nanopb (callbacks → zero allocation, streaming encode/decode).
// Client: protobuf.js ("light" runtime, JSON descriptor generated from this file).
// Regenerate on the C side: see main/proto/generate.sh
// IMPORTANT: field names are EXACTLY those expected by the JS (index.html).
syntax = "proto3";

// ── Request (client → kart) ──
// `type` keeps the same verbs as the old JSON protocol: status, get, vals, sysdyn,
// sysinfo, hist, wifiget, padinfo, reboot, padpair, padunpair, calstart, calfinish,
// calcancel, wifiset, set.
message Req {
  string type = 1;
  string ssid = 2;              // wifiset
  string pass = 3;              // wifiset
  bool   enabled = 4;           // wifiset
  repeated ParamVal set = 5;    // set: name/value pairs
}

message ParamVal {
  string name = 1;
  oneof value {                 // typed value: bool / int32 / float (matches the param's type)
    bool  bval = 2;
    int32 ival = 3;
    float fval = 4;
  }
}

// ── Responses (kart → client) ──
message Status {
  // Nested so the generated C types are Status_State / Status_Fault / Status_BrakeMode —
  // they must NOT collide with the C++ enum class State/Fault/BrakeMode in control_types.hpp.
  enum State     { LOCKOUT = 0; CALIBRATE = 1; RUN = 2; FAULT = 3; }
  enum BrakeMode { NONE = 0; DYNAMIC = 1; ACTIVE = 2; }
  enum Fault {
    NO_FAULT = 0; ESTOP = 1; LVC = 2; NOT_CALIBRATED = 3; ENCODER = 4;
    ENCODER_DIR = 5; ENCODER_MAD = 6; ENCODER_ABSENT = 7; ENCODER_MAGNET = 8;
  }
  State  state = 1;
  Fault  fault = 2;
  uint32 faults = 3;            // mask of active conditions (fb:: bits)
  float  vbat = 4;
  int32  batt_type = 5;         // 0 while detecting, 12 or 24
  float  batt_lo = 6;           // gauge scale decided on the firmware side
  float  batt_hi = 7;
  float  speed_ms = 8;          // VEHICLE speed (m/s, signed — 0 while pivoting)
  float  rpm_l = 9;             // LEFT wheel speed in rpm (signed)
  float  rpm_r = 10;            // RIGHT wheel speed in rpm (signed)
  float  fwd = 11;
  float  turn = 12;
  float  out_l = 13;
  float  out_r = 14;
  BrakeMode brake_mode = 15;    // NONE (traction/freewheel) · DYNAMIC · ACTIVE (PID)
  bool   arming = 16;
  bool   btn_start = 17;
  bool   pad_conn = 18;
  int32  pad_batt = 19;
  float  pad_x = 20;
  float  pad_y = 21;
  float  pad_cx = 22;
  float  pad_cy = 23;
  float  pad_zl = 24;
  float  pad_zr = 25;
  float  pad_rx2 = 26;
  float  pad_ry2 = 27;
  uint32 pad_btns = 28;
  int32  pad_age_ms = 29;       // gamepad heartbeat (age of the last HID report)
}

message ParamMeta {
  string name = 1;
  string desc = 2;
  string cat = 3;
  string help = 4;
  // Field 5 was a "type" string and 6/7 were float min/max — all replaced by the typed
  // oneofs below, so value / min / max / default each carry the parameter's real type
  // (the client renders a checkbox for a bool, an integer input for an int, etc.).
  oneof value { bool bval = 8;  int32 ival = 9;  float fval = 10; }  // current value
  oneof minv  { bool bmin = 11; int32 imin = 12; float fmin = 13; }  // minimum
  oneof maxv  { bool bmax = 14; int32 imax = 15; float fmax = 16; }  // maximum
  oneof defv  { bool bdef = 17; int32 idef = 18; float fdef = 19; }  // default
}

message Config { repeated ParamMeta params = 1; }
message Vals   { repeated ParamVal  params = 1; }

// History: each series = RAW bytes (1 byte/sample, oldest → newest).
message Hist {
  uint32 dt_fast = 1;           // s between samples (accel/pwm/rpm)
  uint32 dt_spd = 2;
  uint32 dt_batt = 3;
  bytes  accel = 4;
  bytes  pwml = 5;
  bytes  pwmr = 6;
  bytes  rpml = 7;
  bytes  rpmr = 8;
  bytes  spd = 9;               // m/s ×10
  bytes  batt = 10;             // V ×10
}

message Pad {
  bool   conn = 1;
  string name = 2;
  int32  batt = 3;
  bool   calibrated = 4;
  int32  calstate = 5;
  bool   pairing = 6;
}

message Wifi {
  bool   enabled = 1;
  string ssid = 2;
  bool   connected = 3;
  string ip = 4;
}

message Ip6 {
  string addr = 1;
  string type = 2;
}

message SysInfo {
  string fw_ver = 1;
  string fw_proj = 2;
  string fw_date = 3;
  string idf = 4;
  string chip = 5;
  int32  cores = 6;
  int32  rev = 7;
  uint32 flash_mb = 8;
  int64  uptime_s = 9;
  uint32 heap_free = 10;
  uint32 heap_min = 11;
  string reset = 12;
  string mac_ap = 13;
  string mac_sta = 14;
  string ap_ssid = 15;
  string ip_ap = 16;
  bool   sta_en = 17;
  string sta_ssid = 18;
  bool   sta_conn = 19;
  string ip_sta = 20;
  repeated Ip6 ip6_ap = 21;
  repeated Ip6 ip6_sta = 22;
}

message SysDyn {
  int64  uptime_s = 1;
  uint32 heap_free = 2;
  uint32 heap_min = 3;
  uint32 ledc_fix = 4;          // LEDC clock sentinel
}

message Ok {}

// Envelope: a single frame type on the WebSocket (binary), the oneof does the dispatch.
message Msg {
  oneof body {
    Status  status = 1;
    Config  config = 2;
    Vals    vals = 3;
    Hist    hist = 4;
    Pad     pad = 5;
    Wifi    wifi = 6;
    SysInfo sysinfo = 7;
    SysDyn  sysdyn = 8;
    Ok      ok = 9;
  }
}
