// kart.proto — Binary WebSocket protocol of the kart (Protocol Buffers).
// Server: nanopb (callbacks → zero allocation, streaming encode/decode).
// Client: protobuf.js ("light" runtime, JSON descriptor generated from this file).
// Regenerate on the C side: see main/proto/generate.sh
// IMPORTANT: field names are EXACTLY those expected by the JS (index.html).
syntax = "proto3";

// ── Request (client → kart) ──
// `type` keeps the same verbs as the old JSON protocol: status, get, vals, sysdyn,
// sysinfo, hist, wifiget, padinfo, reboot, padpair, padunpair, calstart, calfinish,
// calcancel, wifiset, set.
message Req {
  string type = 1;
  string ssid = 2;              // wifiset
  string pass = 3;              // wifiset
  bool   enabled = 4;           // wifiset
  repeated ParamVal set = 5;    // set: name/value pairs
}

message ParamVal {
  string name = 1;
  oneof value {                 // typed value: bool / int32 / float (matches the param's type)
    bool  bval = 2;
    int32 ival = 3;
    float fval = 4;
  }
}

// ── Responses (kart → client) ──
// Fields 4-7 (vbat, batt_type, batt_lo, batt_hi) and 30 (idle_off_s) are RESERVED, not
// reused: nothing measures the battery any more and the firmware cannot cut its own power.
message Status {
  // Nested so the generated C types are Status_State / Status_Stop / Status_BrakeMode —
  // they must NOT collide with the C++ enum class State/Stop/BrakeMode in control_types.hpp.
  // 3 was FAULT — there is no fault state any more (see Stop), so it is retired, not reused.
  enum State     { reserved 3; LOCKOUT = 0; CALIBRATE = 1; RUN = 2; }
  // 2 was ACTIVE (PID braking, gone with the encoders); it now means COAST — live only.
  enum BrakeMode { NONE = 0; DYNAMIC = 1; COAST = 2; }
  // WHY the kart will not drive — ONE cause, mirrors enum class Stop (control_types.hpp).
  // It replaces the Fault enum and the fault bitmask, both dropped on 2026-09-30: nothing
  // the firmware can see can break any more, and what is left are four ordinary gamepad
  // conditions. Value names are prefixed because enum values share the message's scope
  // (NONE is already BrakeMode's).
  enum Stop { STOP_NONE = 0; STOP_PAD_LOST = 1; STOP_PAD_STALE = 2; STOP_ESTOP = 3;
              STOP_NOT_CALIBRATED = 4; }
  // 8/9/10 were speed_ms / rpm_l / rpm_r: nothing measures the wheels any more.
  // 2 (fault) and 3 (faults) went with the fault layer on 2026-09-30 — see stop = 32.
  reserved 2, 3, 4, 5, 6, 7, 8, 9, 10, 30;
  State  state = 1;
  float  fwd = 11;
  float  turn = 12;
  float  out_l = 13;
  float  out_r = 14;
  BrakeMode brake_mode = 15;    // NONE (driving) · DYNAMIC (short-circuit) · COAST (pseudo-freewheel)
  bool   arming = 16;
  bool   btn_start = 17;
  bool   pad_conn = 18;
  int32  pad_batt = 19;
  float  pad_x = 20;
  float  pad_y = 21;
  float  pad_cx = 22;
  float  pad_cy = 23;
  float  pad_zl = 24;
  float  pad_zr = 25;
  float  pad_rx2 = 26;
  float  pad_ry2 = 27;
  uint32 pad_btns = 28;
  int32  pad_age_ms = 29;       // gamepad heartbeat (age of the last HID report)
  bool   btn_drive = 31;        // A held (hold to drive)
  Stop   stop = 32;             // why it will not drive (STOP_NONE = nothing in the way)
}

message ParamMeta {
  string name = 1;
  string desc = 2;
  string cat = 3;
  string help = 4;
  // Field 5 was a "type" string and 6/7 were float min/max — all replaced by the typed
  // oneofs below, so value / min / max / default each carry the parameter's real type
  // (the client renders a checkbox for a bool, an integer input for an int, etc.).
  oneof value { bool bval = 8;  int32 ival = 9;  float fval = 10; }  // current value
  oneof minv  { bool bmin = 11; int32 imin = 12; float fmin = 13; }  // minimum
  oneof maxv  { bool bmax = 14; int32 imax = 15; float fmax = 16; }  // maximum
  oneof defv  { bool bdef = 17; int32 idef = 18; float fdef = 19; }  // default
}

message Config { repeated ParamMeta params = 1; }
message Vals   { repeated ParamVal  params = 1; }

// History: each series = RAW bytes (1 byte/sample, oldest → newest).
message Hist {
  reserved 3, 10;               // dt_batt / batt — the battery chart went with the ADC
  reserved 2, 7, 8, 9;          // dt_spd / rpml / rpmr / spd — went with the encoders
  uint32 dt_fast = 1;           // s between samples (accel/pwm)
  bytes  accel = 4;
  bytes  pwml = 5;
  bytes  pwmr = 6;
  bytes  loop = 11;             // worst 500 Hz tick per slot, in 50 µs units
}

message Pad {
  bool   conn = 1;
  string name = 2;
  int32  batt = 3;
  bool   calibrated = 4;
  int32  calstate = 5;
  bool   pairing = 6;
}

message Wifi {
  bool   enabled = 1;
  string ssid = 2;
  bool   connected = 3;
  string ip = 4;
  string error = 5;             // wifiset REFUSED: reason to show; empty = saved
}

message Ip6 {
  string addr = 1;
  string type = 2;
}

message SysInfo {
  string fw_ver = 1;
  string fw_proj = 2;
  string fw_date = 3;
  string idf = 4;
  string chip = 5;
  int32  cores = 6;
  int32  rev = 7;
  uint32 flash_mb = 8;
  int64  uptime_s = 9;
  uint32 heap_free = 10;
  uint32 heap_min = 11;
  string reset = 12;
  string mac_ap = 13;
  string mac_sta = 14;
  string ap_ssid = 15;
  string ip_ap = 16;
  bool   sta_en = 17;
  string sta_ssid = 18;
  bool   sta_conn = 19;
  string ip_sta = 20;
  repeated Ip6 ip6_ap = 21;
  repeated Ip6 ip6_sta = 22;
  string mdns = 23;             // mDNS host name WITHOUT the suffix ("kart" → kart.local)
}

message SysDyn {
  int64  uptime_s = 1;
  uint32 heap_free = 2;
  uint32 heap_min = 3;
  uint32 ledc_fix = 4;          // LEDC clock sentinel
  uint32 loop_max_us = 5;       // worst 500 Hz tick since last read (budget 2000 µs)
  reserved 6;                   // sens_max_us — the I2C sensor read is gone
  // Gamepad link quality: CUMULATIVE count of HID report-to-report gaps per bucket
  // (diff two reads), and the worst gap of the last complete 1 s window.
  uint32 pad_gap_max_ms = 7;
  uint32 pad_gap_le15   = 8;
  uint32 pad_gap_le30   = 9;
  uint32 pad_gap_le60   = 10;
  uint32 pad_gap_le120  = 11;
  uint32 pad_gap_le250  = 12;
  uint32 pad_gap_over   = 13;
  // Wi-Fi context for the same read: stations on the SoftAP, STA link RSSI (0 = not connected).
  uint32 ap_sta   = 14;
  sint32 sta_rssi = 15;
}

message Ok {}

// Persistent event log ("why did it disarm"): last entries, oldest → newest.
// code mirrors evlog::Ev (1 Boot, 2 Arm, 7 Disarm; 3 the old mask-carrying Disarm, 4 Fault,
// 5 IdleOff and 6 LvcOff are retired but may still sit in an older partition);
// data is the Stop cause for Disarm, the reset reason for Boot.
message EvlogEntry {
  uint32 t_ms = 1;              // uptime of that boot, in ms
  uint32 boot = 2;              // boot counter (persisted): groups entries per power cycle
  uint32 code = 3;
  uint32 data = 4;
}

message Evlog {
  repeated EvlogEntry ev = 1;   // capped server-side (last EVLOG_REPLY_MAX records)
  uint32 total = 2;             // records on flash
  uint32 pending = 3;           // raised but not yet drained (kart armed) — refresh later
}

// Envelope: a single frame type on the WebSocket (binary), the oneof does the dispatch.
message Msg {
  oneof body {
    Status  status = 1;
    Config  config = 2;
    Vals    vals = 3;
    Hist    hist = 4;
    Pad     pad = 5;
    Wifi    wifi = 6;
    SysInfo sysinfo = 7;
    SysDyn  sysdyn = 8;
    Ok      ok = 9;
    Evlog   evlog = 10;
  }
}
